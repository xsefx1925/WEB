<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="utf-8" />
	<title>Генератор шахматной доски</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			text-align: center;
		}

		/* Контейнер для доски */
		#chessboard {
			display: grid;
			border: 2px solid #333;
			max-width: fit-content;
			margin: 20px auto;
		}

		/* Стилизация клеток */
		.cell {
			width: 40px; /* Размер клетки */
			height: 40px;
		}

		.white {
			background-color: #f0d9b5; /* Цвет белой клетки */
		}

		.black {
			background-color: #b58863; /* Цвет чёрной клетки */
		}

		form {
			margin-bottom: 20px;
		}

		input {
			padding: 5px;
			font-size: 16px;
		}
	</style>
</head>
<body>
	<h1>Генератор шахматной доски</h1>
	<form>
		<label for="boardSize">Размер доски (например, 8):</label>
		<input type="number" id="boardSize" min="1" max="50" oninput="generateChessboard()" />
	</form>

	<div id="chessboard"></div>

	<script>function generateChessboard() {
            // Получаем элементы DOM
            const boardSizeInput = document.getElementById("boardSize");
            const chessboard = document.getElementById("chessboard");

            // Преобразуем значение из поля ввода в целое число
            const boardSize = parseInt(boardSizeInput.value);

            // Очищаем доску перед новой генерацией
            chessboard.innerHTML = "";

            // Валидация ввода
            if (isNaN(boardSize) || boardSize < 1 || boardSize > 50) {
                chessboard.innerHTML = "Пожалуйста, введите число от 1 до 50.";
                return;
            }

            // Устанавливаем количество колонок для CSS Grid
            chessboard.style.gridTemplateColumns = `repeat(${boardSize}, 40px)`;

            // Создаём клетки с помощью вложенных циклов
            for (let row = 0; row < boardSize; row++) {
                for (let col = 0; col < boardSize; col++) {
                    // Создаём новый элемент div
                    const cell = document.createElement("div");
                    cell.classList.add("cell");

                    // Определяем цвет клетки по сумме координат
                    if ((row + col) % 2 === 0) {
                        cell.classList.add("white");
                    } else {
                        cell.classList.add("black");
                    }

                    // Добавляем клетку на доску
                    chessboard.appendChild(cell);
                }
            }
        }</script>
</body>
</html>
